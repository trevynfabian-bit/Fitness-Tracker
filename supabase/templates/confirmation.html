<!--
  Sign-up confirmation email.

  The default Supabase template points at the GoTrue verify endpoint. This one
  points at the application's own /auth/confirm route handler, which exchanges
  the one-time token for a session and then redirects. Without it that route is
  never exercised.
-->
<h2>Confirm your Health Platform account</h2>

<p>Follow the link below to confirm this email address and finish creating your account.</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">
    Confirm my account
  </a>
</p>

<p>If you did not create this account, you can ignore this email.</p>
